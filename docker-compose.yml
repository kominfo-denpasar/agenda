version: "3.8"

services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: hievents_app
    restart: always
    env_file: .env
    volumes:
      - ./backend:/var/www/html
      - ./storage:/var/www/html/storage
    depends_on:
      - db
      - redis
    networks:
      - hievents_net

  frontend:
    build: ./frontend
    container_name: hievents_frontend
    restart: always
    env_file: .env
    ports:
      - "5173:5173" # Vite dev server
    volumes:
      - ./frontend:/app
    depends_on:
      - app
    networks:
      - hievents_net

  db:
    image: mysql:8.0
    container_name: hievents_db
    restart: always
    environment:
      MYSQL_DATABASE: hievents
      MYSQL_USER: hievents
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./mysql:/var/lib/mysql
    networks:
      - hievents_net

  redis:
    image: redis:alpine
    container_name: hievents_redis
    restart: always
    volumes:
      - ./redis:/data
    networks:
      - hievents_net

  nginx:
    image: nginx:alpine
    container_name: hievents_nginx
    restart: always
    ports:
      - "8002:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./backend:/var/www/html
    depends_on:
      - app
      - frontend
    networks:
      - hievents_net

networks:
  hievents_net:
    driver: bridge
